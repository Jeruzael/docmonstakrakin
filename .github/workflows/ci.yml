name: CI

on:
  pull_request:
    branches:
      - master
      - 'codex/campaign-*'
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows_native:
    name: Windows Native Qualification
    runs-on: windows-2022
    # Fresh npm and Bun now each exercise the private authority, actual App,
    # TLS and backup fixtures in addition to the disconnected native contracts.
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      CI: "true"
      GEMINI_API_KEY: ""
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - name: Checkout isolated candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record existing Windows toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          $userConfig = Join-Path $env:RUNNER_TEMP 'native-empty.npmrc'
          Set-Content -LiteralPath $userConfig -Value ''
          "NPM_CONFIG_USERCONFIG=$userConfig" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NPM_CONFIG_CACHE=$env:RUNNER_TEMP/native-npm-cache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NPM_CONFIG_DEVDIR=$env:RUNNER_TEMP/native-node-headers" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          node --input-type=module -e "import fs from 'node:fs'; import os from 'node:os'; console.log(JSON.stringify({defaultTemp:os.tmpdir(),sync:fs.realpathSync(os.tmpdir()),async:await fs.promises.realpath(os.tmpdir())}));"
          if ($LASTEXITCODE -ne 0) { throw 'Default temporary-path inventory failed' }
          # Exercise the runner's actual default TEMP (including RUNNER~1).
          # Native canonicalization must agree without a TEMP override.
          Write-Output "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          node --version
          if ($LASTEXITCODE -ne 0) { throw 'Node inventory failed' }
          npm.cmd --version
          if ($LASTEXITCODE -ne 0) { throw 'npm inventory failed' }
          python --version
          if ($LASTEXITCODE -ne 0) { throw 'Python inventory failed' }
          git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Checkout identity unavailable' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0) { throw 'Existing C++ tools unavailable' }
          $kits = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10'
          $sdks = @(Get-ChildItem -LiteralPath "$kits/Include" -Directory | Where-Object {
            (Test-Path -LiteralPath "$($_.FullName)/um/Windows.h") -and
            (Test-Path -LiteralPath "$kits/Lib/$($_.Name)/um/x64/kernel32.lib") -and
            (Test-Path -LiteralPath "$kits/Lib/$($_.Name)/ucrt/x64/ucrt.lib")
          })
          if ($sdks.Count -eq 0) { throw 'No complete preinstalled Windows SDK' }
          $sdks.FullName

      - name: Diagnose disposable runner token and new-object ownership
        run: ./scripts/runWindowsPrivateQualification.ps1 -Phase Diagnostics

      - name: Fresh npm install and audit with lifecycle scripts
        run: |
          npm.cmd ci --foreground-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Clean Windows npm installation failed' }
          npm.cmd audit --json
          if ($LASTEXITCODE -ne 0) { throw 'Windows npm audit failed' }
          npm.cmd ls better-sqlite3 argon2 vite source-map-js express body-parser --all
          if ($LASTEXITCODE -ne 0) { throw 'Installed dependency provenance failed' }

      - name: Qualify npm native runtime and existing quality gates
        run: |
          node scripts/testBunLifecycleInventory.ts
          if ($LASTEXITCODE -ne 0) { throw 'Bun lifecycle inventory guard regression failed' }
          npx.cmd playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Disposable Chromium fixture acquisition failed' }
          node --input-type=module -e "import fs from 'node:fs'; import os from 'node:os'; console.log(JSON.stringify({fixtureTemp:os.tmpdir(),sync:fs.realpathSync(os.tmpdir()),async:await fs.promises.realpath(os.tmpdir())}));"
          if ($LASTEXITCODE -ne 0) { throw 'Fixture temporary-path inventory failed' }
          node --import tsx scripts/testSyntheticSecurityFoundations.ts
          if ($LASTEXITCODE -ne 0) { throw 'npm-installed native foundations failed' }
          node --import tsx scripts/testAuthPilot.ts
          if ($LASTEXITCODE -ne 0) { throw 'npm-installed disconnected authentication pilot failed' }
          node --import tsx scripts/testAuthPilotRecovery.ts
          if ($LASTEXITCODE -ne 0) { throw 'npm-installed test-only process recovery failed' }
          node --import tsx scripts/testSyntheticSessionCapacity.ts
          if ($LASTEXITCODE -ne 0) { throw 'npm-installed synthetic session capacity failed' }
          node --import tsx scripts/testSyntheticStorePaths.ts
          if ($LASTEXITCODE -ne 0) { throw 'npm-installed native path protections failed' }
          node --import tsx scripts/testSyntheticWbsRegistration.ts
          if ($LASTEXITCODE -ne 0) { throw 'npm-installed synthetic WBS transaction qualification failed' }
          node --import tsx scripts/testBodyParserSecurity.ts
          if ($LASTEXITCODE -ne 0) { throw 'npm-installed compressed-body security regression failed' }
          # Runtime owner checks remain strict. A distinct suspended-child token
          # qualifies current-user ownership without changing the runner token.
          ./scripts/runWindowsPrivateQualification.ps1 -Phase Npm
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'npm verification changed tracked source' }

      - name: Fresh frozen Bun install in a separate exact-checkout clone
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = $utf8
          $OutputEncoding = $utf8
          $sha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Checkout identity unavailable' }
          $clone = Join-Path $env:RUNNER_TEMP 'native-bun-checkout'
          git clone --no-hardlinks --no-checkout $env:GITHUB_WORKSPACE $clone
          if ($LASTEXITCODE -ne 0) { throw 'Disposable Bun clone failed' }
          git -C $clone checkout --detach $sha
          if ($LASTEXITCODE -ne 0) { throw 'Bun checkout identity mismatch' }
          if (Test-Path -LiteralPath "$clone/node_modules") { throw 'Bun dependency tree must start absent' }
          npx.cmd --yes --package=bun@1.4.2 -- bun --version
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Bun acquisition failed' }
          Push-Location $clone
          try {
            npx.cmd --yes --package=bun@1.4.2 -- bun install --frozen-lockfile --cache-dir "$env:RUNNER_TEMP/native-bun-cache"
            if ($LASTEXITCODE -ne 0) { throw 'Clean frozen Windows Bun installation failed' }
            npx.cmd --yes --package=bun@1.4.2 -- bun audit --json
            if ($LASTEXITCODE -ne 0) { throw 'Frozen Windows Bun dependency audit failed' }
            npm.cmd ls express body-parser --all
            if ($LASTEXITCODE -ne 0) { throw 'Frozen Windows Bun parser dependency provenance failed' }
            $untrusted = npx.cmd --yes --package=bun@1.4.2 -- bun pm untrusted 2>&1
            $trustExit = $LASTEXITCODE
            $untrusted | ForEach-Object { Write-Output $_ }
            if ($trustExit -ne 0) { throw 'Bun lifecycle trust inventory failed' }
            $untrusted | node scripts/lib/bunLifecycleInventory.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Bun lifecycle inventory guard failed' }
            node --import tsx scripts/testSyntheticSecurityFoundations.ts
            if ($LASTEXITCODE -ne 0) { throw 'Bun-installed native foundations failed' }
            node --import tsx scripts/testAuthPilot.ts
            if ($LASTEXITCODE -ne 0) { throw 'Bun-installed disconnected authentication pilot failed' }
            node --import tsx scripts/testAuthPilotRecovery.ts
            if ($LASTEXITCODE -ne 0) { throw 'Bun-installed test-only process recovery failed' }
            node --import tsx scripts/testSyntheticSessionCapacity.ts
            if ($LASTEXITCODE -ne 0) { throw 'Bun-installed synthetic session capacity failed' }
            node --import tsx scripts/testSyntheticStorePaths.ts
            if ($LASTEXITCODE -ne 0) { throw 'Bun-installed native path protections failed' }
            node --import tsx scripts/testSyntheticWbsRegistration.ts
            if ($LASTEXITCODE -ne 0) { throw 'Bun-installed synthetic WBS transaction qualification failed' }
            node --import tsx scripts/testBodyParserSecurity.ts
            if ($LASTEXITCODE -ne 0) { throw 'Bun-installed compressed-body security regression failed' }
            ./scripts/runWindowsPrivateQualification.ps1 -Phase Bun
            git diff --exit-code
            if ($LASTEXITCODE -ne 0) { throw 'Bun verification changed tracked source' }
          } finally { Pop-Location }

  quality:
    name: Quality & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit candidate npm dependencies
        run: npm audit --json --registry=https://registry.npmjs.org

      - name: Record isolated vulnerable-baseline dependency provenance
        # One-time before/after evidence for this remediation PR only. Candidate
        # audit/native gates above and below are unconditional and stay strict.
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/body-parser-security-20261024'
        shell: bash
        run: |
          set -euo pipefail
          baseline=$(mktemp -d "$RUNNER_TEMP/body-parser-before.XXXXXX")
          git clone --no-hardlinks --no-checkout "$GITHUB_WORKSPACE" "$baseline"
          git -C "$baseline" checkout --detach 796adced2b0e9795b801c808359dee9c8839d7c4
          cd "$baseline"
          test ! -e node_modules
          printf 'registry=https://registry.npmjs.org\n'
          node --version
          npm --version
          sha256sum package.json package-lock.json bun.lock
          npm ci --foreground-scripts --registry=https://registry.npmjs.org
          npm ls express body-parser --all --json
          cp "$GITHUB_WORKSPACE/scripts/testBodyParserSecurity.ts" scripts/testBodyParserSecurity.ts
          set +e
          node --import tsx scripts/testBodyParserSecurity.ts > "$RUNNER_TEMP/body-parser-before-behavior.log" 2>&1
          behavior_status=$?
          set -e
          cat "$RUNNER_TEMP/body-parser-before-behavior.log"
          test "$behavior_status" -eq 1
          node --input-type=module - "$RUNNER_TEMP/body-parser-before-behavior.log" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const log=fs.readFileSync(process.argv[2],'utf8');
          const summary=JSON.parse(log.trim().split('\n').at(-1));
          assert.equal(summary.passed,6);assert.equal(summary.failed,1);
          assert.match(log,/Z_DATA_ERROR/);
          assert.match(log,/FAIL gzip frame followed by bounded trailing bytes/);
          console.log('Vulnerable baseline child crash retained; no real application state used.');
          NODE
          cp "$GITHUB_WORKSPACE/scripts/testWorkspaceEnforcedServer.ts" scripts/testWorkspaceEnforcedServer.ts
          set +e
          node --import tsx scripts/testWorkspaceEnforcedServer.ts > "$RUNNER_TEMP/body-parser-before-application.log" 2>&1
          behavior_status=$?
          set -e
          cat "$RUNNER_TEMP/body-parser-before-application.log"
          test "$behavior_status" -eq 1
          node --input-type=module - "$RUNNER_TEMP/body-parser-before-application.log" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const log=fs.readFileSync(process.argv[2],'utf8');
          const summary=JSON.parse(log.trim().split('\n').at(-1));
          assert.equal(summary.passed,7);assert.equal(summary.failed,1);
          assert.match(log,/Z_DATA_ERROR/);
          assert.match(log,/FAIL trailing compressed bytes cannot terminate/);
          console.log('Actual ENFORCED baseline non-API crash retained; no authority was initialized.');
          NODE
          date -u +%FT%TZ
          set +e
          npm audit --json --registry=https://registry.npmjs.org > "$RUNNER_TEMP/body-parser-before-npm-audit.json"
          audit_status=$?
          set -e
          cat "$RUNNER_TEMP/body-parser-before-npm-audit.json"
          test "$audit_status" -eq 1
          node --input-type=module - "$RUNNER_TEMP/body-parser-before-npm-audit.json" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const audit=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const advisories=Object.values(audit.vulnerabilities).flatMap(v=>v.via).filter(v=>typeof v==='object');
          assert.ok(advisories.length>0);
          assert.ok(advisories.every(v=>v.url==='https://github.com/advisories/GHSA-27r3-jxmh-p828'));
          console.log('Historical vulnerable-baseline observation only; candidate audits must be clean.');
          NODE
          bun_baseline=$(mktemp -d "$RUNNER_TEMP/body-parser-before-bun.XXXXXX")
          git clone --no-hardlinks --no-checkout "$baseline" "$bun_baseline"
          git -C "$bun_baseline" checkout --detach 796adced2b0e9795b801c808359dee9c8839d7c4
          cd "$bun_baseline"
          test ! -e node_modules
          npx --yes --package=bun@1.4.2 -- bun install --frozen-lockfile --cache-dir "$RUNNER_TEMP/body-parser-before-bun-cache"
          npm ls express body-parser --all --json
          date -u +%FT%TZ
          set +e
          npx --yes --package=bun@1.4.2 -- bun audit --json > "$RUNNER_TEMP/body-parser-before-bun-audit.json"
          audit_status=$?
          set -e
          cat "$RUNNER_TEMP/body-parser-before-bun-audit.json"
          test "$audit_status" -eq 1
          node --input-type=module - "$RUNNER_TEMP/body-parser-before-bun-audit.json" <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const audit=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const advisories=Object.values(audit).flat();
          assert.ok(advisories.length>0);
          assert.ok(advisories.every(v=>v.url==='https://github.com/advisories/GHSA-27r3-jxmh-p828'));
          console.log('Frozen Bun historical observation only; candidate audit gates remain strict.');
          NODE

      - name: Verify fail-closed Bun lifecycle inventory guard
        run: node scripts/testBunLifecycleInventory.ts

      - name: Verify WBS integrity
        run: npm run wbs:check

      - name: TypeScript typecheck
        run: npm run lint

      - name: Verify disconnected foundations native provenance and process recovery
        run: |
          node --import tsx scripts/testSyntheticSecurityFoundations.ts
          node --import tsx scripts/testAuthPilotRecovery.ts

      - name: Verify transactional synthetic session capacity
        run: node --import tsx scripts/testSyntheticSessionCapacity.ts

      - name: Production build
        run: npm run build

      - name: Fresh frozen Linux Bun native qualification
        shell: bash
        run: |
          set -euo pipefail
          candidate=$(mktemp -d "$RUNNER_TEMP/native-linux-bun.XXXXXX")
          sha=$(git rev-parse HEAD)
          git clone --no-hardlinks --no-checkout "$GITHUB_WORKSPACE" "$candidate"
          git -C "$candidate" checkout --detach "$sha"
          test ! -e "$candidate/node_modules"
          cd "$candidate"
          npx --yes --package=bun@1.4.2 -- bun --version
          npx --yes --package=bun@1.4.2 -- bun install --frozen-lockfile --cache-dir "$RUNNER_TEMP/native-linux-bun-cache"
          npx --yes --package=bun@1.4.2 -- bun audit --json
          npm ls express body-parser --all
          untrusted=$(npx --yes --package=bun@1.4.2 -- bun pm untrusted 2>&1)
          printf '%s\n' "$untrusted"
          printf '%s\n' "$untrusted" | node scripts/lib/bunLifecycleInventory.mjs
          node --import tsx scripts/testSyntheticSecurityFoundations.ts
          node --import tsx scripts/testBodyParserSecurity.ts
          node --import tsx scripts/testSyntheticSessionCapacity.ts
          node --import tsx scripts/testSyntheticStorePaths.ts
          node --import tsx scripts/testAuthPilotRecovery.ts
          node --import tsx scripts/testWorkspaceStore.ts
          node --import tsx scripts/testWorkspaceActionReceipts.ts
          node --import tsx scripts/testWorkspaceActionApplication.ts
          node --import tsx scripts/testWorkspaceTls.ts
          node --import tsx scripts/testWorkspaceBackup.ts
          git diff --exit-code

  controlled_docs:
    name: Controlled Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium dependencies
        run: npx playwright install --with-deps chromium

      - name: Prepare synthetic CI runtime
        run: npm run ci:prepare

      - name: Run controlled-document regression
        run: npm run test:controlled-docs

      - name: Verify repository cleanliness
        run: |
          git diff --exit-code
          git diff --cached --exit-code

  complete_regression:
    name: Complete Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium dependencies
        run: npx playwright install --with-deps chromium

      - name: Prepare synthetic CI runtime
        run: npm run ci:prepare

      - name: Run complete regression suite
        run: npm run test:complete

      - name: Dump failed regression logs
        if: failure()
        run: npm run regression:dump-failures

      - name: Upload regression failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: complete-regression-failure-${{ github.sha }}
          path: |
            runtime/rc-regression/results.json
            runtime/rc-regression/*.log
            runtime/dmk-194-remediation/ui/
          if-no-files-found: warn

      - name: Verify repository cleanliness
        run: |
          git diff --exit-code
          git diff --cached --exit-code
