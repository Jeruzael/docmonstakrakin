name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify WBS integrity
        run: npm run wbs:check

      - name: TypeScript typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

  controlled_docs:
    name: Controlled Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium dependencies
        run: npx playwright install --with-deps chromium

      - name: Prepare synthetic CI runtime
        run: npm run ci:prepare

      - name: Run controlled-document regression
        run: npm run test:controlled-docs

      - name: Verify repository cleanliness
        run: |
          git diff --exit-code
          git diff --cached --exit-code

  complete_regression:
    name: Complete Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium dependencies
        run: npx playwright install --with-deps chromium

      - name: Prepare synthetic CI runtime
        run: npm run ci:prepare

      - name: Run complete regression suite
        run: npm run test:complete

      - name: Dump failed regression logs
        if: failure()
        run: |
          for f in runtime/rc-regression/*.log; do
            if [ -f "$f" ] && grep -q -E '(FAIL|Error:)' "$f"; then
              echo "=========================================="
              echo "FAILED LOG: $f"
              echo "=========================================="
              cat "$f"
            fi
          done

      - name: Verify repository cleanliness
        run: |
          git diff --exit-code
          git diff --cached --exit-code
