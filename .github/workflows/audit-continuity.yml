name: Audit Continuity Qualification

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/audit-continuity.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'server/security/workspaceAccess/**'
      - 'scripts/testWorkspaceAuditContinuity.ts'
      - 'scripts/fixtures/auditContinuity*'
      - 'scripts/fixtures/capacityInspectorSynthetic.cjs'
      - 'scripts/fixtures/qualifyAuditContinuity.sh'
  push:
    branches: [master]
    paths:
      - '.github/workflows/audit-continuity.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'server/security/workspaceAccess/**'
      - 'scripts/testWorkspaceAuditContinuity.ts'
      - 'scripts/fixtures/auditContinuity*'
      - 'scripts/fixtures/capacityInspectorSynthetic.cjs'
      - 'scripts/fixtures/qualifyAuditContinuity.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline_linux:
    name: Linux Offline Continuity Qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CI: 'true'
      NODE_OPTIONS: ''
    steps:
      - name: Checkout exact isolated candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup qualified Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Fresh lifecycle-enabled dependencies
        run: npm ci --foreground-scripts
      - name: Require disposable qualification tools
        run: |
          set -euo pipefail
          for tool in mkfs.ext4 runuser unshare mount umount truncate; do command -v "$tool"; done
          test -c /dev/loop-control
          test "$(id -u)" -ne 0
          test ! -L node_modules
          sudo -n true
          node --version
          git rev-parse HEAD
      - name: Anchor contracts and unsupported-input tests
        run: |
          set -euo pipefail
          mkdir -p .local/continuity-ci
          node --import tsx scripts/testWorkspaceAuditContinuity.ts 2>&1 | tee .local/continuity-ci/contracts.log
      - name: Qualify offline stages with real SQLite and filesystem faults
        run: |
          set -euo pipefail
          node_path="$(realpath "$(command -v node)")"
          modules_path="$(realpath node_modules)"
          runner_user="$(id -un)"
          # Explicit private namespace; new task-only 64 MiB readonly source and
          # 1 GiB writable output images. The engine and fault probes are nonroot.
          sudo -n sh scripts/fixtures/qualifyAuditContinuity.sh "$node_path" "$modules_path" "$runner_user" 2>&1 |
            tee .local/continuity-ci/qualification.log
          sha256sum .local/continuity-ci/*.log
          git diff --exit-code
      - name: Retain synthetic logs without private fixture keys or databases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-continuity-${{ github.sha }}
          path: .local/continuity-ci/*.log
          if-no-files-found: warn
          retention-days: 14
